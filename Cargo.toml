[workspace]
resolver = "2"
members = [
    "crates/sdr-core",
    "crates/sdr-dsp",
    "crates/sdr-hardware",
    "crates/sdr-demod",
    "crates/sdr-protocols",
    "crates/sdr-spectrum",
    "crates/sdr-station",
    "crates/sdr-mesh",
    "crates/sdr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["sdr.rs contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/crussella0129/sdr.rs"

[workspace.dependencies]
sdr-core = { path = "crates/sdr-core" }
sdr-dsp = { path = "crates/sdr-dsp" }
sdr-hardware = { path = "crates/sdr-hardware" }
sdr-demod = { path = "crates/sdr-demod" }
sdr-protocols = { path = "crates/sdr-protocols" }
sdr-spectrum = { path = "crates/sdr-spectrum" }
sdr-station = { path = "crates/sdr-station" }
sdr-mesh = { path = "crates/sdr-mesh" }

num-complex = "0.4"
num-traits = "0.2"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
tokio = { version = "1.43", features = ["full"] }
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
crossbeam-queue = "0.3.13"
